[project]
name = "latent-dispatch"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  # pinned: Qwen3 needs >=4.51; the KV code is tested against this exact version
  "transformers==4.57.6",
  "datasets>=3.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "jupyterlab>=4",
  "ipykernel>=6",
  "papermill>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["latent_dispatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real model weights (MODEL=..., default Qwen3-0.6B) or the real datasets (run with -m slow)"]
addopts = "-m 'not slow'"
